name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest"

      - name: Install Godot and export templates
        env:
          GODOT_VERSION: 4.5.1-stable
        run: |
          python3 scripts/install-godot-headless.py
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          godot --version
          java -version
          sdkmanager --version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$HOME/.local/share/godot/export_templates"

      - name: Build debug APK
        run: bash scripts/build-android-debug.sh

      - name: Verify APK
        run: |
          test -f godot_project/build/android/TankWall-debug.apk
          ls -lh godot_project/build/android/TankWall-debug.apk

      - name: Verify deforming rig and locomotion
        run: |
          godot --headless --path godot_project --script res://tests/test_swim.gd
          godot --headless --path godot_project --script res://tests/test_pivot.gd
          godot --headless --fixed-fps 60 --path godot_project --script res://tests/diagnose_runtime.gd

      - name: Upload TankWall APK
        uses: actions/upload-artifact@v4
        with:
          name: TankWall-debug-apk
          path: godot_project/build/android/TankWall-debug.apk
          if-no-files-found: error
          retention-days: 14
