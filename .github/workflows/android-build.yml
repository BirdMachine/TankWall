name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Install Godot and export templates
        run: |
          python3 scripts/install-godot-headless.py
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          godot --version
          java -version
          sdkmanager --version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$HOME/.local/share/godot/export_templates"

      - name: Build debug APK
        run: bash scripts/build-android-debug.sh

      - name: Verify APK
        run: |
          test -f godot_project/build/android/TankWall-debug.apk
          ls -lh godot_project/build/android/TankWall-debug.apk

      - name: Upload TankWall APK
        uses: actions/upload-artifact@v4
        with:
          name: TankWall-debug-apk
          path: godot_project/build/android/TankWall-debug.apk
          if-no-files-found: error
          retention-days: 14
