name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest"

      - name: Install Godot and export templates
        env:
          GODOT_VERSION: 4.5.1-stable
        run: |
          python3 scripts/install-godot-headless.py
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          godot --version
          java -version
          sdkmanager --version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$HOME/.local/share/godot/export_templates"

      - name: Build debug APK
        run: bash scripts/build-android-debug.sh

      - name: Build separate swim beta
        run: godot --headless --path godot_project --export-debug "Android Swim Beta" build/android/TankWall-Fishy-Beta.apk

      - name: Build native emulator check
        run: godot --headless --path godot_project --export-debug "Android Emulator" build/android/TamoTank-Emulator.apk

      - name: Verify APK
        run: |
          test -f godot_project/build/android/TankWall-debug.apk
          ls -lh godot_project/build/android/TankWall-debug.apk

      - name: Verify deforming rig and locomotion
        run: |
          python3 godot_project/tests/verify-purchased-rig.py
          godot --headless --path godot_project --script res://tests/test_swim.gd
          godot --headless --path godot_project --script res://tests/test_pivot.gd
          godot --headless --path godot_project --script res://tests/test_corners.gd
          godot --headless --path godot_project --script res://tests/test_volume.gd
          godot --headless --path godot_project --script res://tests/test_companion.gd
          godot --headless --path godot_project --script res://tests/test_living_tank.gd
          godot --headless --path godot_project --script res://tests/test_customization.gd
          godot --headless --path godot_project --script res://tests/test_fin_cloth.gd
          godot --headless --path godot_project --script res://tests/test_deep_fins.gd
          godot --headless --path godot_project --script res://tests/test_fin_rig.gd
          godot --headless --fixed-fps 60 --path godot_project --script res://tests/diagnose_runtime.gd

      - name: Upload TankWall APK
        uses: actions/upload-artifact@v4
        with:
          name: TankWall-debug-apk
          path: godot_project/build/android/TankWall-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload swim beta APK
        uses: actions/upload-artifact@v4
        with:
          name: TankWall-nightflight-beta
          path: godot_project/build/android/TankWall-Fishy-Beta.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload native emulator APK
        uses: actions/upload-artifact@v4
        with:
          name: TamoTank-emulator-check
          path: godot_project/build/android/TamoTank-Emulator.apk
          if-no-files-found: error
          retention-days: 7

  wallpaper-emulator:
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: TamoTank-emulator-check
          path: native-check
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Provide Mesa OpenGL display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          Xvfb :99 -screen 0 1080x2280x24 -nolisten tcp > /tmp/tamotank-xvfb.log 2>&1 &
      - name: Check Android wallpaper lifecycle
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -gpu host -feature -Vulkan -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: python3 scripts/test-android-wallpaper.py native-check/TamoTank-Emulator.apk --output native-check/results
      - name: Preserve native check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TamoTank-native-wallpaper-evidence
          path: native-check/results
          if-no-files-found: warn
          retention-days: 7
